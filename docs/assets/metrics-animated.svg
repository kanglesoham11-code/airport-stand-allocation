<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgKpi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090e22"/>
      <stop offset="100%" stop-color="#111a37"/>
    </linearGradient>
    <clipPath id="kpiClip">
      <rect width="1100" height="220" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#kpiClip)">
    <rect width="1100" height="220" fill="url(#bgKpi)"/>

    <!-- Card 1: Assigned Rate (71.4%) -->
    <g transform="translate(26, 26)">
      <rect width="244" height="168" rx="14" fill="#131c3a" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="18" y="32" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" letter-spacing="0.8">M1 • ASSIGNED FLIGHTS</text>
      <text x="18" y="76" font-family="Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#ffffff">30 / 42</text>
      <text x="18" y="102" font-family="Consolas, monospace" font-size="12.5" fill="#94a3b8">71.4% placed • 12 overflow</text>
      <!-- Animated progress bar -->
      <rect x="18" y="124" width="208" height="10" rx="5" fill="#1e293b"/>
      <rect x="18" y="124" width="148" height="10" rx="5" fill="#34d399">
        <animate attributeName="width" values="0;148;148" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="18" y="152" font-family="Consolas, monospace" font-size="11" fill="#6ee7b7">CP-SAT Solver: FEASIBLE</text>
    </g>

    <!-- Card 2: CP-SAT Gain -->
    <g transform="translate(294, 26)">
      <rect width="244" height="168" rx="14" fill="#131c3a" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="18" y="32" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="0.8">M7 &amp; M8 • SOLVER GAIN</text>
      <text x="18" y="76" font-family="Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#ffffff">+4 / +2</text>
      <text x="18" y="102" font-family="Consolas, monospace" font-size="12.5" fill="#94a3b8">+4 flights • +2 PLB vs greedy</text>
      <rect x="18" y="124" width="208" height="10" rx="5" fill="#1e293b"/>
      <rect x="18" y="124" width="182" height="10" rx="5" fill="#38bdf8">
        <animate attributeName="width" values="0;182;182" dur="4s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <text x="18" y="152" font-family="Consolas, monospace" font-size="11" fill="#7dd3fc">Auto FALLBACK_GREEDY guard</text>
    </g>

    <!-- Card 3: Peak Demand & Utilisation -->
    <g transform="translate(562, 26)">
      <rect width="244" height="168" rx="14" fill="#131c3a" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="18" y="32" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c4b5fd" letter-spacing="0.8">M3 &amp; M4 • PEAK &amp; UTIL</text>
      <text x="18" y="76" font-family="Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#ffffff">40.3%</text>
      <text x="18" y="102" font-family="Consolas, monospace" font-size="12.5" fill="#94a3b8">12/12 peak stands @ 09:15</text>
      <rect x="18" y="124" width="208" height="10" rx="5" fill="#1e293b"/>
      <rect x="18" y="124" width="84" height="10" rx="5" fill="#a78bfa">
        <animate attributeName="width" values="0;84;84" dur="4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="18" y="152" font-family="Consolas, monospace" font-size="11" fill="#c4b5fd">104,400 / 259,200 stand-sec</text>
    </g>

    <!-- Card 4: Data Quality & Latency -->
    <g transform="translate(830, 26)">
      <rect width="244" height="168" rx="14" fill="#131c3a" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="18" y="32" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#fde68a" letter-spacing="0.8">QUALITY &amp; API SPEED</text>
      <text x="18" y="76" font-family="Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#ffffff">~16 ms</text>
      <text x="18" y="102" font-family="Consolas, monospace" font-size="12.5" fill="#94a3b8">9 issues: 2 fixed • 7 dropped</text>
      <rect x="18" y="124" width="208" height="10" rx="5" fill="#1e293b"/>
      <rect x="18" y="124" width="196" height="10" rx="5" fill="#fbbf24">
        <animate attributeName="width" values="0;196;196" dur="4s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <text x="18" y="152" font-family="Consolas, monospace" font-size="11" fill="#fde68a">P95 latency • ETag 304 cache</text>
    </g>
  </g>
</svg>
