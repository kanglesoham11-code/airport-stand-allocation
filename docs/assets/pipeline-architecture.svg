<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="420">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f"/>
      <stop offset="100%" stop-color="#111a36"/>
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="archClip">
      <rect width="1100" height="420" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#archClip)">
    <rect width="1100" height="420" fill="url(#bgArch)"/>

    <!-- Section Header -->
    <text x="36" y="42" font-family="Segoe UI, Ubuntu, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">
      SYSTEM DESIGN &amp; DUAL-CANDIDATE PIPELINE
    </text>
    <text x="36" y="64" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" fill="#94a3b8">
      Compute-once transactional startup pipeline feeding a zero-DB-overhead cached runtime API
    </text>

    <!-- STARTUP PIPELINE GROUP -->
    <rect x="28" y="84" width="1044" height="178" rx="14" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-dasharray="6 4"/>
    <text x="44" y="106" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1">
      STARTUP PIPELINE (service.build_run) — TRANSACTIONAL &amp; DETERMINISTIC
    </text>

    <!-- Connecting Animated Dashed Lines (Startup) -->
    <g stroke-width="2.5" fill="none">
      <path d="M 190 170 L 240 170" stroke="#38bdf8" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M 380 170 L 420 140" stroke="#34d399" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M 380 170 L 420 212" stroke="#f59e0b" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M 600 140 L 642 170" stroke="#34d399" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M 600 212 L 642 170" stroke="#f59e0b" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M 800 170 L 855 170" stroke="#a78bfa" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Animated Data Packets -->
    <circle r="4" fill="#38bdf8" filter="url(#softGlow)">
      <animateMotion path="M 190 170 L 240 170" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#34d399" filter="url(#softGlow)">
      <animateMotion path="M 380 170 L 420 140 L 600 140 L 642 170" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#fbbf24" filter="url(#softGlow)">
      <animateMotion path="M 380 170 L 420 212 L 600 212 L 642 170" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#c084fc" filter="url(#softGlow)">
      <animateMotion path="M 800 170 L 855 170" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Node 1: CSV Loader -->
    <g transform="translate(46, 132)">
      <rect width="144" height="76" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
      <text x="14" y="26" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">1. CSV Loader</text>
      <text x="14" y="45" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">stands.csv (12)</text>
      <text x="14" y="61" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">flights.csv (49)</text>
    </g>

    <!-- Node 2: 16-Step Validator -->
    <g transform="translate(240, 132)">
      <rect width="140" height="76" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.6"/>
      <text x="12" y="26" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#93c5fd">2. Validator</text>
      <text x="12" y="45" font-family="Consolas, monospace" font-size="11" fill="#6ee7b7">42 Valid Flights</text>
      <text x="12" y="61" font-family="Consolas, monospace" font-size="11" fill="#fda4af">2 Fixed • 7 Dropped</text>
    </g>

    <!-- Node 3A: CP-SAT Exact -->
    <g transform="translate(420, 114)">
      <rect width="180" height="54" rx="10" fill="#064e3b" fill-opacity="0.65" stroke="#34d399" stroke-width="1.8">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <text x="12" y="23" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">3A. OR-Tools CP-SAT</text>
      <text x="12" y="41" font-family="Consolas, monospace" font-size="10.5" fill="#d1fae5">Max Assigned→PLB→Fit</text>
    </g>

    <!-- Node 3B: Greedy Baseline -->
    <g transform="translate(420, 184)">
      <rect width="180" height="54" rx="10" fill="#451a03" fill-opacity="0.55" stroke="#f59e0b" stroke-width="1.6"/>
      <text x="12" y="23" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fcd34d">3B. Greedy Baseline</text>
      <text x="12" y="41" font-family="Consolas, monospace" font-size="10.5" fill="#fef3c7">Most-Constrained-First</text>
    </g>

    <!-- Node 4: Post-Process & Metrics -->
    <g transform="translate(642, 132)">
      <rect width="158" height="76" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.6"/>
      <text x="12" y="26" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#c4b5fd">4. Post &amp; Metrics</text>
      <text x="12" y="45" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">Fill + PLB Upgrade</text>
      <text x="12" y="61" font-family="Consolas, monospace" font-size="11" fill="#a7f3d0">M1–M8 + Reasons</text>
    </g>

    <!-- Node 5: SQLite Persistence -->
    <g transform="translate(855, 132)">
      <rect width="192" height="76" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8"/>
      <text x="14" y="26" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">5. SQLite Repository</text>
      <text x="14" y="45" font-family="Consolas, monospace" font-size="11" fill="#e0e7ff">BEGIN IMMEDIATE TX</text>
      <text x="14" y="61" font-family="Consolas, monospace" font-size="11" fill="#c7d2fe">Migrations + Retention</text>
    </g>

    <!-- Bridge Startup -> Runtime Cache -->
    <path d="M 951 208 L 951 286 L 810 286" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <circle r="4.5" fill="#34d399" filter="url(#softGlow)">
      <animateMotion path="M 951 208 L 951 286 L 810 286" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- RUNTIME PIPELINE GROUP -->
    <rect x="28" y="280" width="1044" height="118" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="44" y="302" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399" letter-spacing="1">
      RUNTIME REQUEST PIPELINE — ZERO DB I/O PER REQUEST
    </text>

    <!-- Runtime connectors -->
    <path d="M 225 346 L 280 346" fill="none" stroke="#f43f5e" stroke-width="2.2" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 540 346 L 595 346" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 810 346 L 860 346" fill="none" stroke="#34d399" stroke-width="2.2" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.9s" repeatCount="indefinite"/>
    </path>

    <!-- Runtime Node 1: Client / CORS -->
    <g transform="translate(46, 316)">
      <rect width="179" height="60" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.6"/>
      <text x="12" y="25" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#f9a8d4">HTTP Client &amp; CORS</text>
      <text x="12" y="45" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">CORSMiddleware + TLS</text>
    </g>

    <!-- Runtime Node 2: Security & Rate Limit Middleware -->
    <g transform="translate(280, 316)">
      <rect width="260" height="60" rx="10" fill="#1e293b" stroke="#fb7185" stroke-width="1.6"/>
      <text x="12" y="25" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#fda4af">RequestPipelineMiddleware</text>
      <text x="12" y="45" font-family="Consolas, monospace" font-size="10.5" fill="#e2e8f0">HMAC Auth • Dual Buckets • ETag</text>
    </g>

    <!-- Runtime Node 3: Cached SavedRun -->
    <g transform="translate(595, 316)">
      <rect width="215" height="60" rx="10" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="1.8"/>
      <text x="12" y="25" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#6ee7b7">In-Memory _CACHED_RUN</text>
      <text x="12" y="45" font-family="Consolas, monospace" font-size="10.5" fill="#d1fae5">Frozen Dataclasses (P95 ~16ms)</text>
    </g>

    <!-- Runtime Node 4: Observability -->
    <g transform="translate(860, 316)">
      <rect width="187" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
      <text x="12" y="25" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#7dd3fc">JSON Logs &amp; Ops</text>
      <text x="12" y="45" font-family="Consolas, monospace" font-size="10.5" fill="#cbd5e1">/health • /ready • /ops/stats</text>
    </g>
  </g>
</svg>
