<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b1e">
        <animate attributeName="stop-color" values="#070b1e;#0e1938;#070b1e" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0f2347">
        <animate attributeName="stop-color" values="#0f2347;#163663;#0f2347" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a1040">
        <animate attributeName="stop-color" values="#1a1040;#12264d;#1a1040" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <clipPath id="bannerClip">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect width="1200" height="320" fill="url(#bgGrad)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- Ambient Radar Rings (Right) -->
    <g transform="translate(1030, 145)">
      <circle r="35" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle r="70" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="6 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="105" fill="none" stroke="#818cf8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="10 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/>
      </circle>
      <!-- Expanding radar pulse -->
      <circle r="10" fill="none" stroke="#34d399" stroke-width="2">
        <animate attributeName="r" values="10;120" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.8;0" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <!-- Radar sweep line -->
      <line x1="0" y1="0" x2="95" y2="0" stroke="#34d399" stroke-width="2" stroke-opacity="0.55" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </line>
      <circle r="4" fill="#34d399" filter="url(#glow)"/>
    </g>

    <!-- Runway Lights (Bottom Strip) -->
    <g opacity="0.75">
      <line x1="60" y1="262" x2="1140" y2="262" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="18 14"/>
      <circle cx="120" cy="262" r="3" fill="#38bdf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="262" r="3" fill="#34d399"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.25s" repeatCount="indefinite"/></circle>
      <circle cx="360" cy="262" r="3" fill="#38bdf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="262" r="3" fill="#818cf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.75s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="262" r="3" fill="#34d399"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="1.0s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="262" r="3" fill="#38bdf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="1.25s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="262" r="3" fill="#818cf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="262" r="3" fill="#34d399"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="1.75s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Flying Aircraft + Contrail -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-160,68; 1320,42" dur="9s" repeatCount="indefinite"/>
      <line x1="-130" y1="0" x2="-12" y2="0" stroke="url(#trailGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-12,-2 L2,-2 L10,-12 L15,-12 L10,-2 L20,-2 L24,-6 L27,-6 L25,0 L27,6 L24,6 L20,2 L10,2 L15,12 L10,12 L2,2 L-12,2 Z"
            fill="#e0f2fe" filter="url(#glow)"/>
    </g>

    <!-- Animated Waves -->
    <path fill="url(#waveGrad1)">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0,265 Q300,235 600,268 T1200,255 L1200,320 L0,320 Z;
                M0,255 Q300,285 600,252 T1200,270 L1200,320 L0,320 Z;
                M0,265 Q300,235 600,268 T1200,255 L1200,320 L0,320 Z"/>
    </path>
    <path fill="url(#waveGrad2)">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0,275 Q300,295 600,270 T1200,282 L1200,320 L0,320 Z;
                M0,282 Q300,258 600,285 T1200,268 L1200,320 L0,320 Z;
                M0,275 Q300,295 600,270 T1200,282 L1200,320 L0,320 Z"/>
    </path>

    <!-- Top Badge Pill -->
    <g transform="translate(70, 56)">
      <rect width="265" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.5"/>
      <circle cx="18" cy="14" r="4.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="18.5" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bae6fd" letter-spacing="1.2">
        OR-TOOLS CP-SAT • FASTAPI
      </text>
    </g>

    <!-- Main Title -->
    <text x="70" y="136" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="0.5">
      Aleph Airport Stand Allocation
    </text>

    <!-- Subtitle -->
    <text x="72" y="176" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1">
      Exact Constraint Optimization &amp; Production-Hardened Aviation Operations API
    </text>

    <!-- Mini Telemetry Chips -->
    <g transform="translate(70, 202)" font-family="Consolas, Monaco, monospace" font-size="12.5" font-weight="700">
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="14" y="20" fill="#6ee7b7">✓ 44/44 TESTS PASS</text>

      <rect x="174" y="0" width="175" height="32" rx="8" fill="#6366f1" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="188" y="20" fill="#c7d2fe">⚡ +4 FLIGHTS / +2 PLB</text>

      <rect x="363" y="0" width="170" height="32" rx="8" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="377" y="20" fill="#bae6fd">🛡️ DUAL RATE LIMIT</text>

      <rect x="547" y="0" width="155" height="32" rx="8" fill="#f59e0b" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text x="561" y="20" fill="#fde68a">🐳 DOCKER READY</text>
    </g>
  </g>
</svg>
