<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Twilight Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="55%" stop-color="#0a1324"/>
      <stop offset="85%" stop-color="#13233c"/>
      <stop offset="100%" stop-color="#1b314f"/>
    </linearGradient>

    <!-- Dusk Horizon Glow (behind airport) -->
    <radialGradient id="horizonGlow" cx="76%" cy="80%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a1324" stop-opacity="0"/>
    </radialGradient>

    <!-- Apron / Tarmac Surface -->
    <linearGradient id="tarmacGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Landing Light Cone -->
    <linearGradient id="landingBeam" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.52"/>
      <stop offset="50%" stop-color="#fde68a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>

    <!-- Glideslope Dashed Line -->
    <linearGradient id="glideGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Terminal Glass Glow -->
    <linearGradient id="termGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Fuselage Metallic Shading -->
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Floodlight Cone -->
    <radialGradient id="apronLight" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="heroClip">
      <rect width="1200" height="360" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <!-- Sky + Atmospheric Horizon -->
    <rect width="1200" height="360" fill="url(#skyGrad)"/>
    <rect width="1200" height="360" fill="url(#horizonGlow)"/>

    <!-- Faint High-Altitude Stars -->
    <g fill="#e2e8f0">
      <circle cx="540" cy="34" r="0.9" opacity="0.4"/>
      <circle cx="660" cy="52" r="0.8" opacity="0.3"/>
      <circle cx="790" cy="28" r="1.0" opacity="0.45"/>
      <circle cx="910" cy="46" r="0.8" opacity="0.35"/>
      <circle cx="1040" cy="24" r="1.0" opacity="0.4"/>
      <circle cx="1130" cy="58" r="0.9" opacity="0.3"/>
    </g>

    <!-- Distant City / Hangar Skyline Silhouette -->
    <path d="M520,278 L520,264 L560,264 L560,272 L610,272 L610,256 L675,256 L675,278 Z"
          fill="#0b1526" opacity="0.85"/>

    <!-- ATC Control Tower (Background Right-Center) -->
    <g transform="translate(835, 138)">
      <!-- Tower Shaft -->
      <polygon points="10,140 16,32 28,32 34,140" fill="#0f1d33" stroke="#1e3a5f" stroke-width="0.8"/>
      <!-- Observation Cab -->
      <polygon points="2,32 42,32 47,16 -3,16" fill="#172a46" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="0.8"/>
      <!-- Illuminated Cab Windows -->
      <polygon points="4,29 40,29 43,19 1,19" fill="#38bdf8" fill-opacity="0.45"/>
      <!-- Roof & Antenna -->
      <rect x="0" y="13" width="44" height="3" rx="1" fill="#334155"/>
      <line x1="22" y1="13" x2="22" y2="0" stroke="#64748b" stroke-width="1.2"/>
      <!-- Rotating / Pulsing Airport Beacon -->
      <circle cx="22" cy="0" r="2.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="22" cy="0" r="8" fill="#34d399" fill-opacity="0.25">
        <animate attributeName="r" values="3;14;3" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0;0.45" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Airport Terminal Concourse & Illuminated Gates (Right) -->
    <g transform="translate(895, 224)">
      <!-- Main Terminal Structure -->
      <path d="M0,54 L0,20 L18,12 L290,12 L305,22 L305,54 Z" fill="#111f36" stroke="#243b5e" stroke-width="1"/>
      <!-- Glass Curtain Wall -->
      <rect x="16" y="22" width="272" height="22" rx="2" fill="url(#termGlass)"/>
      <!-- Vertical Mullions & Warm Gate Bays -->
      <g fill="#fde68a" fill-opacity="0.28">
        <rect x="24" y="26" width="24" height="14" rx="1"/>
        <rect x="58" y="26" width="24" height="14" rx="1"/>
        <rect x="92" y="26" width="24" height="14" rx="1"/>
        <rect x="126" y="26" width="24" height="14" rx="1"/>
        <rect x="160" y="26" width="24" height="14" rx="1"/>
        <rect x="194" y="26" width="24" height="14" rx="1"/>
        <rect x="228" y="26" width="24" height="14" rx="1"/>
        <rect x="262" y="26" width="20" height="14" rx="1"/>
      </g>

      <!-- Gate Labels -->
      <g font-family="Consolas, monospace" font-size="8.5" font-weight="700" fill="#7dd3fc">
        <rect x="40" y="2" width="26" height="12" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
        <text x="45" y="11">C01</text>
        <rect x="132" y="2" width="26" height="12" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
        <text x="137" y="11">C02</text>
        <rect x="224" y="2" width="26" height="12" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
        <text x="229" y="11">C03</text>
      </g>

      <!-- Articulated PLB Jetways -->
      <g stroke="#475569" stroke-width="1" fill="#1e293b">
        <path d="M50,44 L50,58 L36,68 L44,72 L58,60 L58,44 Z"/>
        <path d="M142,44 L142,58 L130,66 L138,70 L150,60 L150,44 Z"/>
        <path d="M234,44 L234,58 L224,66 L232,70 L242,60 L242,44 Z"/>
      </g>

      <!-- Apron Floodlight Masts -->
      <polygon points="85,12 52,58 118,58" fill="url(#apronLight)"/>
      <polygon points="185,12 152,58 218,58" fill="url(#apronLight)"/>
    </g>

    <!-- Parked Widebody Aircraft at Gate C01 (Stationary + Beacon) -->
    <g transform="translate(888, 286)">
      <!-- Shadow on tarmac -->
      <ellipse cx="44" cy="18" rx="38" ry="4" fill="#020617" opacity="0.75"/>
      <!-- Tail fin -->
      <path d="M72,6 L84,-10 L90,-10 L82,8 Z" fill="#1e3a8a"/>
      <!-- Fuselage -->
      <path d="M8,10 Q4,10 6,7 Q14,3 35,3 L76,3 L84,7 L78,11 L14,11 Z" fill="url(#fuselageGrad)"/>
      <!-- Cockpit & Windows -->
      <path d="M10,6 L16,5 L16,7 L10,7 Z" fill="#0f172a"/>
      <line x1="22" y1="6.5" x2="64" y2="6.5" stroke="#334155" stroke-width="1" stroke-dasharray="2 1.5"/>
      <!-- Wing -->
      <path d="M36,9 L58,17 L64,16 L46,8 Z" fill="#94a3b8"/>
      <!-- Tail logo light -->
      <circle cx="82" cy="-6" r="1.5" fill="#fde68a" opacity="0.7"/>
      <!-- Anti-collision red beacon -->
      <circle cx="46" cy="2.5" r="1.6" fill="#ef4444">
        <animate attributeName="opacity" values="0;1;0;0;0" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Runway & Apron Tarmac Base -->
    <rect x="0" y="278" width="1200" height="82" fill="url(#tarmacGrad)"/>
    <line x1="0" y1="278" x2="1200" y2="278" stroke="#334155" stroke-width="1"/>

    <!-- Taxiway Amber Lead-in Lines (Stand guidance) -->
    <path d="M 520 330 Q 740 326 892 302" fill="none" stroke="#f59e0b" stroke-opacity="0.42" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Runway Centerline & Edge Lights (Perspective left-to-right approach) -->
    <g>
      <line x1="0" y1="322" x2="840" y2="322" stroke="#1e293b" stroke-width="26"/>
      <line x1="20" y1="322" x2="820" y2="322" stroke="#e2e8f0" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="22 18"/>
      <!-- Runway Threshold Bars -->
      <g fill="#cbd5e1" fill-opacity="0.35">
        <rect x="650" y="311" width="18" height="3"/>
        <rect x="650" y="317" width="18" height="3"/>
        <rect x="650" y="325" width="18" height="3"/>
        <rect x="650" y="331" width="18" height="3"/>
      </g>
    </g>

    <!-- Sequenced ALS Approach "Rabbit" Lights (Flashing toward runway) -->
    <g>
      <circle cx="1140" cy="322" r="2.2" fill="#38bdf8"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="0.00s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="322" r="2.2" fill="#38bdf8"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="0.14s" repeatCount="indefinite"/></circle>
      <circle cx="1020" cy="322" r="2.2" fill="#38bdf8"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="0.28s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="322" r="2.2" fill="#38bdf8"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="0.42s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="322" r="2.2" fill="#38bdf8"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.4s" begin="0.56s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="322" r="2.4" fill="#34d399"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.70s" repeatCount="indefinite"/></circle>
      <!-- PAPI 4-Light Box (2 white, 2 red = on glideslope) -->
      <rect x="676" y="302" width="22" height="5" rx="1" fill="#020617"/>
      <circle cx="680" cy="304.5" r="1.5" fill="#f8fafc"/>
      <circle cx="685" cy="304.5" r="1.5" fill="#f8fafc"/>
      <circle cx="690" cy="304.5" r="1.5" fill="#ef4444"/>
      <circle cx="695" cy="304.5" r="1.5" fill="#ef4444"/>
    </g>

    <!-- Subtle ILS Glideslope Vector -->
    <line x1="1200" y1="62" x2="660" y2="318" stroke="url(#glideGrad)" stroke-width="1.2" stroke-dasharray="5 7"/>

    <!-- Realistic Commercial Airliner Descending on Final Approach (Right -> Left Runway) -->
    <g>
      <!-- Smooth descending approach + flare -->
      <animateTransform attributeName="transform" type="translate"
        values="1240,48; 920,185; 675,296; 430,308; 160,308; -180,308"
        keyTimes="0; 0.35; 0.62; 0.78; 0.90; 1"
        dur="11s" repeatCount="indefinite"/>

      <g>
        <!-- Pitch rotation: nose-down descent -> flare -> level rollout -->
        <animateTransform attributeName="transform" type="rotate"
          values="-14; -12; 3; 0; 0; 0"
          keyTimes="0; 0.35; 0.62; 0.78; 0.90; 1"
          dur="11s" repeatCount="indefinite"/>

        <!-- Landing Light Beam Cone -->
        <polygon points="-46,8 -210,58 -210,94 -46,12" fill="url(#landingBeam)"/>

        <!-- Far Wing (subtle depth) -->
        <path d="M-4,5 L14,-4 L20,-4 L6,5 Z" fill="#64748b"/>

        <!-- Vertical Tailfin -->
        <path d="M26,2 L44,-18 L52,-18 L41,3 Z" fill="#0284c7"/>
        <path d="M41,-15 L50,-15 L44,-18 Z" fill="#38bdf8"/>

        <!-- Horizontal Stabilizer -->
        <path d="M36,4 L49,2 L50,5 L35,6 Z" fill="#94a3b8"/>

        <!-- Main Fuselage (Realistic Nose + Belly) -->
        <path d="M-50,8 C-50,4 -42,1 -32,1 L36,1 L48,5 L45,9 L-34,11 C-44,11 -50,10 -50,8 Z"
              fill="url(#fuselageGrad)"/>

        <!-- Cockpit Windshield -->
        <path d="M-44,4.5 L-36,3 L-35,6 L-44,6 Z" fill="#0f172a"/>
        <!-- Cabin Window Line -->
        <line x1="-26" y1="5" x2="26" y2="5" stroke="#1e293b" stroke-width="1.3" stroke-dasharray="2.2 1.6"/>

        <!-- Swept Main Wing & Turbofan Nacelle -->
        <path d="M-12,8 L18,19 L25,18 L2,7 Z" fill="#cbd5e1"/>
        <rect x="-10" y="10" width="12" height="5" rx="2.2" fill="#334155"/>
        <ellipse cx="-10" cy="12.5" rx="1.6" ry="2.4" fill="#94a3b8"/>

        <!-- Deployed Landing Gear -->
        <line x1="-35" y1="11" x2="-35" y2="15" stroke="#94a3b8" stroke-width="1.2"/>
        <circle cx="-35" cy="16" r="1.5" fill="#1e293b" stroke="#94a3b8" stroke-width="0.6"/>
        <line x1="-2" y1="11" x2="-2" y2="15.5" stroke="#94a3b8" stroke-width="1.4"/>
        <circle cx="-2" cy="16.5" r="1.8" fill="#1e293b" stroke="#94a3b8" stroke-width="0.6"/>

        <!-- Strobe & Navigation Lights -->
        <!-- Red Anti-Collision Beacon -->
        <circle cx="0" cy="0.5" r="1.8" fill="#ef4444">
          <animate attributeName="opacity" values="0;1;0;0;0" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <!-- Wingtip Green Nav + White Strobe -->
        <circle cx="22" cy="18" r="1.5" fill="#34d399"/>
        <circle cx="22" cy="18" r="3" fill="#ffffff">
          <animate attributeName="opacity" values="0;0.95;0;0;0;0" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <!-- Bright Nose Landing Light -->
        <circle cx="-46" cy="9" r="2.2" fill="#fef3c7"/>
      </g>
    </g>

    <!-- Left Gradient Scrim for Crisp Text Legibility -->
    <linearGradient id="leftScrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050811" stop-opacity="0.92"/>
      <stop offset="58%" stop-color="#050811" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </linearGradient>
    <rect x="0" y="0" width="760" height="360" fill="url(#leftScrim)"/>

    <!-- ==================== HERO TYPOGRAPHY (CRISP, NO BLUR) ==================== -->
    <!-- Eyebrow Telemetry Line -->
    <g transform="translate(56, 54)">
      <circle cx="5" cy="5" r="3.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="17" y="9" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc" letter-spacing="1.8">
        ALEPH AVIATION OPERATIONS  •  BUILD SPEC V4
      </text>
    </g>

    <!-- Main Title -->
    <text x="56" y="116" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Aleph Airport
    </text>
    <text x="56" y="164" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#38bdf8" letter-spacing="-0.5">
      Stand Allocation
    </text>

    <!-- Subtitle -->
    <text x="56" y="202" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Exact OR-Tools CP-SAT Optimization &amp; Production-Hardened FastAPI Service
    </text>

    <!-- Clean Aerospace Telemetry Pills -->
    <g transform="translate(56, 232)" font-family="Consolas, 'SF Mono', monospace" font-size="11.5" font-weight="700">
      <g transform="translate(0, 0)">
        <rect width="164" height="30" rx="6" fill="#0f172a" fill-opacity="0.88" stroke="#334155"/>
        <circle cx="14" cy="15" r="3" fill="#34d399"/>
        <text x="25" y="19" fill="#e2e8f0">CP-SAT + Greedy</text>
      </g>
      <g transform="translate(174, 0)">
        <rect width="174" height="30" rx="6" fill="#0f172a" fill-opacity="0.88" stroke="#334155"/>
        <circle cx="14" cy="15" r="3" fill="#38bdf8"/>
        <text x="25" y="19" fill="#e2e8f0">Dual Rate Limiter</text>
      </g>
      <g transform="translate(358, 0)">
        <rect width="154" height="30" rx="6" fill="#0f172a" fill-opacity="0.88" stroke="#334155"/>
        <circle cx="14" cy="15" r="3" fill="#a78bfa"/>
        <text x="25" y="19" fill="#e2e8f0">HMAC Auth + ETag</text>
      </g>
      <g transform="translate(522, 0)">
        <rect width="142" height="30" rx="6" fill="#0f172a" fill-opacity="0.88" stroke="#334155"/>
        <circle cx="14" cy="15" r="3" fill="#fbbf24"/>
        <text x="25" y="19" fill="#e2e8f0">44/44 Tests OK</text>
      </g>
    </g>

    <!-- Subtle Outer Frame -->
    <rect x="0.5" y="0.5" width="1199" height="359" rx="14" fill="none" stroke="#1e293b" stroke-width="1"/>
  </g>
</svg>
